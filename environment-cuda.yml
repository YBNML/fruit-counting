name: counting-env
# PyPI CUDA wheels, pinned to the versions the detector was trained with (kernels for sm_75 and newer).
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pillow
  - pandas
  - pyyaml
  - tqdm
  - scipy
  - scikit-learn
  - opencv=5.0.*
  - gtsam=4.3.*   # conda-forge build; the PyPI wheel requires pytest at runtime
  - tensorboard
  - pytest
  - pytest-cov
  - pip:
      - torch==2.15.0
      - torchvision==0.29.2
      - typer>=0.12
      - pydantic>=2.12
      - albumentations<=2.0.8
      - timm
      - rich
      # PseCo upstream dependencies (ops/ops.py, CLIP text extraction helpers)
      - matplotlib
      - ftfy
      - gpustat
      - open_clip_torch
