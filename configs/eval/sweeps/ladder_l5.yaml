# The oracle ladder (ladder.yaml) plus rung L5, the learned detector's cached boxes on the L3 stages, and
# the report-only baseline L5_L4base (L5 with the L4_base pose and depth noise). The cached rungs read the
# base config's detector.cache, detector.post, detector.digests and tracker.min_obs_cached; the oracle
# rungs ignore them.
rungs:
  L0:  {stages: {track: oracle,   center: truth,    dedup: oracle, assign: truth}, lift: {depth: det_depth}}
  L1:  {stages: {track: landmark, center: truth,    dedup: oracle, assign: truth}, lift: {depth: det_depth}}
  L2a: {stages: {track: landmark, center: truth,    assign: truth}, lift: {depth: det_depth}}
  L2b: {stages: {track: landmark, center: measured, assign: truth}, lift: {depth: det_depth}}
  L2c: {stages: {track: landmark, center: measured, assign: truth}}
  L3:  {stages: {track: landmark, center: measured, assign: grid}}
  L4_base: {stages: {track: landmark, center: measured, assign: grid},
            noise: {pose_trans_sigma_m: 0.02, pose_rot_sigma_deg: 0.5, pass_bias_m: 0.02, depth_rel_sigma: 0.02, depth_dropout: 0.05}}
  L5:  {stages: {det: cached, track: landmark, center: measured, assign: grid}}
baselines:
  L3_dd: {stages: {track: landmark, center: measured, assign: grid}, lift: {depth: det_depth}}
  last_box: {stages: {track: last_box, center: truth, dedup: oracle, assign: truth},
             lift: {depth: det_depth}, tracker: {repair_m: 0}}
  L4_weak: {stages: {track: landmark, center: measured, assign: grid},
            noise: {pose_trans_sigma_m: 0.01, pose_rot_sigma_deg: 0.25, pass_bias_m: 0.01, depth_rel_sigma: 0.01, depth_dropout: 0.0}}
  L4_strong: {stages: {track: landmark, center: measured, assign: grid},
              noise: {pose_trans_sigma_m: 0.05, pose_rot_sigma_deg: 1.0, pass_bias_m: 0.10, depth_rel_sigma: 0.04, depth_dropout: 0.20}}
  L5_L4base: {stages: {det: cached, track: landmark, center: measured, assign: grid},
              noise: {pose_trans_sigma_m: 0.02, pose_rot_sigma_deg: 0.5, pass_bias_m: 0.02, depth_rel_sigma: 0.02, depth_dropout: 0.05}}
interaction_2x2:
  base: L2a
  track: [oracle, landmark]
  dedup: [oracle, crop_default]
