# Oracle ladder. Rungs inherit stages.det and, without stages.dedup, the crop default dedup mode
# from the base config. L2c and L3 have no lift section, so they use the base config's box depth
# method and parameters. L3_dd is report-only.
rungs:
  L0:  {stages: {track: oracle,   center: truth,    dedup: oracle, assign: truth}, lift: {depth: det_depth}}
  L1:  {stages: {track: landmark, center: truth,    dedup: oracle, assign: truth}, lift: {depth: det_depth}}
  L2a: {stages: {track: landmark, center: truth,    assign: truth}, lift: {depth: det_depth}}
  L2b: {stages: {track: landmark, center: measured, assign: truth}, lift: {depth: det_depth}}
  L2c: {stages: {track: landmark, center: measured, assign: truth}}
  L3:  {stages: {track: landmark, center: measured, assign: grid}}
baselines:
  L3_dd: {stages: {track: landmark, center: measured, assign: grid}, lift: {depth: det_depth}}
  last_box: {stages: {track: last_box, center: truth, dedup: oracle, assign: truth},
             lift: {depth: det_depth}, tracker: {repair_m: 0}}
interaction_2x2:
  base: L2a
  track: [oracle, landmark]
  dedup: [oracle, crop_default]
