# Base config of the pose ladder on val for camera configuration c1v (one portrait camera, val only): the c1
# val config on the shaken portrait val scene, with the portrait pass pitch as the reference camera's pitch.
run_name: pear_val_pose_c1v
crop: pear
split: val                 # tuning runs pick settings here; never a verdict
tuning: true               # must be false for split=test
runs: [~/datasets/orchard_synth/pear/val_s200_shake_portrait]
truth: {variant: count1}
passes: {pitches: [45], sides: [A, B], step_m: null}
stages: {det: oracle, track: landmark, center: measured, dedup: self_side, assign: grid}
detector: {positives: count1, cache: runs/detect/88e8c93628216703, noise: null}
lift: {depth: box_far, box_frac: 0.5, center_offset_m: {bag: 0.04}}
noise: {pose_trans_sigma_m: 0, pose_rot_sigma_deg: 0, pass_bias_m: 0, depth_rel_sigma: 0, depth_dropout: 0, seeds: [0, 1, 2]}
tracker: {predict: pose, gate_px_frac: 0.5, gate_m: 0.10, max_gap: null, repair_m: 0.18, min_obs: 1, score_hi: 0.9, score_lo: 0.1, min_obs_cached: 3, depth_gate: soft}
dedup: {radius_m: 0.135, band_m: 0.10}
pose:
  rig_ref: 45
  config_label: c1v
  caches: {vo: {dir: runs/pose/a45a4d9dca516ca8}, vo_dd: {dir: runs/pose/510f2d4b21947576}}   # configs/pose/frozen/pear_vo.yaml and pear_vo_dd.yaml
  imu_files: {imu_ext: {dir: runs/imu/682fc7ac53717171}, imu_lab: {dir: runs/imu/2539defedcbebb34}, imu_icm: {dir: runs/imu/02e33e5ef0e7b86b}, imu_ext_x4: {dir: runs/imu/fee3499d725ef4e8}}   # configs/pose/<name>.yaml
align: {mode: none, segment_m: 6.0, pair_radius_m: 0.5, min_pairs: 20, oracle_sigma_m: 0.02}   # knobs chosen on val; roll_pitch_sigma_deg unset: its start value
seed: 0
stop_after: y6
output_dir: runs/eval_pose
