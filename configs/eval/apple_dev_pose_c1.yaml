# Base config of the pose ladder for camera configuration c1 (one camera): the dev config with the c1 pitches,
# the reference camera's pitch (pose.rig_ref), three noise seeds and the tracker, box depth and dedup settings
# of frozen/apple_test_d1.yaml.
run_name: apple_dev_pose_c1
crop: apple
split: dev                 # dev|val|test|exp; dev numbers are never used for verdicts
tuning: true               # must be false for split=test
runs: [~/YBNML_repo/orchard_synth/out/apple/robot3]
truth: {variant: count1}
passes: {pitches: [30], sides: [A, B], step_m: null}
stages: {det: oracle, track: landmark, center: measured, dedup: hybrid, assign: grid}
detector: {positives: count1, cache: null, noise: null}
lift: {depth: box_far, box_frac: 0.5, center_offset_m: {fruit: 0.02, bag: 0.03}}
noise: {pose_trans_sigma_m: 0, pose_rot_sigma_deg: 0, pass_bias_m: 0, depth_rel_sigma: 0, depth_dropout: 0, seeds: [0, 1, 2]}
tracker: {predict: pose, gate_px_frac: 0.5, gate_m: 0.05, max_gap: null, repair_m: 0.08, min_obs: 1, score_hi: 0.6, score_lo: 0.2, min_obs_cached: 4, depth_gate: soft}
dedup: {radius_m: 0.09, band_m: 0.05}
pose: {rig_ref: 30, config_label: c1}
seed: 0
stop_after: y6
output_dir: runs/eval_pose
