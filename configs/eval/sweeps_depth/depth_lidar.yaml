# LiDAR range, beam angle, dropout and range bias, and the camera depth sigma with the LiDAR on, on base B_drift_ld; a range point keeps the judged within-1 m ratio.
bases: [B_drift_ld]
common:
  noise: {drift_scale_sigma: 0.0045, drift_rate_deg_per_m: 0.045, drift_step_trans_mm: 2.1, drift_step_rot_deg: 0.039,
          pass_side_trans_m: 0.05, pass_side_rot_deg: 0.5,
          rig_extr_trans_mm: 14.0, rig_extr_rot_deg: 0.4,
          depth_rel_sigma: 0.02, depth_dropout: 0.05,
          imu_gyro_n: 1.16e-3, imu_acc_n: 4.97e-3, imu_gyro_w: 1.82e-5, imu_acc_w: 4.75e-4, imu_gyro_b0_dps: 1.0,
          imu_acc_b0_mg: 4.0, imu_temp_k: 1.0,
          imu_time_offset_ms: 0.0, imu_extr_trans_mm: 10.0, imu_extr_rot_deg: 0.3,
          lidar_range_sigma_m: 0.02, lidar_range_sigma_near_m: 0.03, lidar_near_range_m: 1.0, lidar_ang_sigma_deg: 0.15,
          lidar_dropout: 0.05, lidar_range_bias_m: 0.0,
          lidar_extr_trans_mm: 10.0, lidar_extr_rot_deg: 0.3}
factors:
  noise.lidar_ang_sigma_deg: [0.05, 0.3]
  noise.lidar_dropout: [0.0, 0.2]
  noise.lidar_range_bias_m: [0.01, 0.02]
  noise.depth_rel_sigma: [0.01, 0.04]
combos:
  range_sigma_0.01: {noise: {lidar_range_sigma_m: 0.01, lidar_range_sigma_near_m: 0.015}}
  range_sigma_0.03: {noise: {lidar_range_sigma_m: 0.03, lidar_range_sigma_near_m: 0.045}}
  range_sigma_0.05: {noise: {lidar_range_sigma_m: 0.05, lidar_range_sigma_near_m: 0.075}}
