# Base config of the depth ladder on val: the c2 pose config on the shaken val scenes (val seed 200; seed 201 runs
# with --run), the LiDAR files of the depth unit and the navigation unit pinned by digest, the LiDAR depth knobs and
# the judged configuration label c2l.
run_name: apple_val_depth
crop: apple
split: val                 # tuning runs pick settings here; never a verdict
tuning: true               # must be false for split=test
runs: [~/datasets/orchard_synth/apple/val_s200_shake]
truth: {variant: count1}
passes: {pitches: [10, 50], sides: [A, B], step_m: null}
stages: {det: oracle, track: landmark, center: measured, dedup: hybrid, assign: grid}
detector: {positives: count1, cache: runs/detect/88e8c93628216703, noise: null}
lift:
  depth: box_far
  box_frac: 0.5
  center_offset_m: {fruit: 0.02, bag: 0.03}
  lidar: {match: gate, window_s: 0.5, combine: ivw, min_points: 3, gate_k: 3.0, box_frac: 0.5, far_min_frac: 0.25, far_gap_m: 0.03, belief_cam_rel: 0.02, belief_range_m: 0.02}
  lidar_files:
    depth:
      dir: ~/datasets/orchard_synth/apple/lidar/ab3576dcd4f1dcfd
      unit: depth
      sim_config_sha256: "ab3576dcd4f1dcfde7860df779b33e43ca8af837115428cea401a4cfb4f7eb39"
      sim_commits: ["461664412594c5587b35ee8931f940a502ab31af"]
      digests:
        apple_s200_789edf28: "7df365f2745e6b83935f85a20d4d2fb9a88e5ad484f178527e853ca6fda6f760"
        apple_s201_b963f282: "2e2d385c6b5ace43b723ac026ebce5dd2448a9ac7761e1c7c0baff0f4ca62aec"
    nav:
      dir: ~/datasets/orchard_synth/apple/lidar/374e38b829225209
      unit: nav
      sim_config_sha256: "374e38b82922520925fee8af448065d5b4e83299b852726fc6e5d2478b1ca252"
      sim_commits: ["461664412594c5587b35ee8931f940a502ab31af"]
      digests:
        apple_s200_789edf28: "406099c95ee959b8e402eb982eefa5d2f64a5d20b12858a265683a7b9ddf58a2"
        apple_s201_b963f282: "4dd127d7fe8eca759f32c424af7923a0fd61abd1678192b775835683f4431db4"
noise: {pose_trans_sigma_m: 0, pose_rot_sigma_deg: 0, pass_bias_m: 0, depth_rel_sigma: 0, depth_dropout: 0, seeds: [0, 1, 2]}
tracker: {predict: pose, gate_px_frac: 0.5, gate_m: 0.05, max_gap: null, repair_m: 0.08, min_obs: 1, score_hi: 0.6, score_lo: 0.2, min_obs_cached: 4, depth_gate: soft}
dedup: {radius_m: 0.09, band_m: 0.05}
pose:
  rig_ref: 10
  config_label: c2l
  caches: {vo: {dir: runs/pose/b16b37e34b609dd2}, vo_dd: {dir: runs/pose/52ad7d4423dea8fb}}   # configs/pose/frozen/apple_vo.yaml and apple_vo_dd.yaml
  imu_files: {imu_ext: {dir: runs/imu/682fc7ac53717171}}   # configs/pose/frozen/imu_ext.yaml, the judged IMU profile
align: {mode: none, segment_m: 3.0, pair_radius_m: 0.5, roll_pitch_sigma_deg: 1.0, min_pairs: 20, oracle_sigma_m: 0.02}   # knobs chosen on val
seed: 0
stop_after: y6
output_dir: runs/eval_depth_val
