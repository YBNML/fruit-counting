# IMU turn-on biases, camera-IMU extrinsic error and IMU noise density and bias walk levels on base B_drift.
bases: [B_drift]
common:
  noise: {drift_scale_sigma: 0.0045, drift_rate_deg_per_m: 0.045, drift_step_trans_mm: 2.1, drift_step_rot_deg: 0.039,
          pass_side_trans_m: 0.05, pass_side_rot_deg: 0.5,
          rig_extr_trans_mm: 14.0, rig_extr_rot_deg: 0.4,
          depth_rel_sigma: 0.02, depth_dropout: 0.05,
          imu_gyro_n: 1.16e-3, imu_acc_n: 4.97e-3, imu_gyro_w: 1.82e-5, imu_acc_w: 4.75e-4, imu_gyro_b0_dps: 1.0,
          imu_acc_b0_mg: 4.0, imu_temp_k: 1.0,
          imu_time_offset_ms: 0.0, imu_extr_trans_mm: 10.0, imu_extr_rot_deg: 0.3}
factors:
  noise.imu_acc_b0_mg: [2.0, 10.0, 20.0, 40.0]
  noise.imu_gyro_b0_dps: [0.1, 0.5, 3.0]
  noise.imu_extr_rot_deg: [0.1, 0.6, 1.0]
  noise.imu_extr_trans_mm: [2.0, 5.0, 60.0]
combos:
  I_ext_x0.2: {noise: {imu_gyro_n: 2.32e-4, imu_acc_n: 9.94e-4, imu_gyro_w: 3.64e-6, imu_acc_w: 9.5e-5}}
  I_ext_x2: {noise: {imu_gyro_n: 2.32e-3, imu_acc_n: 9.94e-3, imu_gyro_w: 3.64e-5, imu_acc_w: 9.5e-4}}
  I_ext_x4: {noise: {imu_gyro_n: 4.64e-3, imu_acc_n: 1.988e-2, imu_gyro_w: 7.28e-5, imu_acc_w: 1.9e-3}}
  I_ext_x8: {noise: {imu_gyro_n: 9.28e-3, imu_acc_n: 3.976e-2, imu_gyro_w: 1.456e-4, imu_acc_w: 3.8e-3}}
