# Odometry drift profiles, range-dependent depth noise and row-end GPS fixes on base B_drift.
bases: [B_drift]
common:
  noise: {drift_scale_sigma: 0.0045, drift_rate_deg_per_m: 0.045, drift_step_trans_mm: 2.1, drift_step_rot_deg: 0.039,
          pass_side_trans_m: 0.05, pass_side_rot_deg: 0.5,
          rig_extr_trans_mm: 14.0, rig_extr_rot_deg: 0.4,
          depth_rel_sigma: 0.02, depth_dropout: 0.05,
          imu_gyro_n: 1.16e-3, imu_acc_n: 4.97e-3, imu_gyro_w: 1.82e-5, imu_acc_w: 4.75e-4, imu_gyro_b0_dps: 1.0,
          imu_acc_b0_mg: 4.0, imu_temp_k: 1.0,
          imu_time_offset_ms: 0.0, imu_extr_trans_mm: 10.0, imu_extr_rot_deg: 0.3}
combos:
  D_vo: {noise: {drift_scale_sigma: 0.0054, drift_rate_deg_per_m: 0.036, drift_step_trans_mm: 0.78, drift_step_rot_deg: 0.019}}
  D_vo_x3: {noise: {drift_scale_sigma: 0.0162, drift_rate_deg_per_m: 0.108, drift_step_trans_mm: 2.34, drift_step_rot_deg: 0.057}}
  D_ext_x0.5: {noise: {drift_scale_sigma: 0.00225, drift_rate_deg_per_m: 0.0225, drift_step_trans_mm: 1.05,
                       drift_step_rot_deg: 0.0195}}
  D_ext_x3: {noise: {drift_scale_sigma: 0.0135, drift_rate_deg_per_m: 0.135, drift_step_trans_mm: 6.3, drift_step_rot_deg: 0.117}}
  D_ext_x10: {noise: {drift_scale_sigma: 0.045, drift_rate_deg_per_m: 0.45, drift_step_trans_mm: 21.0, drift_step_rot_deg: 0.39}}
  depth_theory: {noise: {depth_k: 0.0036, depth_rel_sigma: 0.0}}
  D_lio: {noise: {drift_scale_sigma: 0.001, drift_rate_deg_per_m: 0.01, drift_step_trans_mm: 2.1, drift_step_rot_deg: 0.039,
                  pass_side_trans_m: 0.03, pass_side_rot_deg: 0.2}}
  G_end: {noise: {gps_end_h_m: 0.02, gps_end_v_m: 0.03}}
  G_end_poor: {noise: {gps_end_h_m: 0.3, gps_end_v_m: 0.5}}
  D_lio_G_end: {noise: {drift_scale_sigma: 0.001, drift_rate_deg_per_m: 0.01, drift_step_trans_mm: 2.1, drift_step_rot_deg: 0.039,
                        pass_side_trans_m: 0.03, pass_side_rot_deg: 0.2, gps_end_h_m: 0.02, gps_end_v_m: 0.03}}
