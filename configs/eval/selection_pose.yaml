# Rules for the values the pose ladder chooses on val before the held-out scenes are scored. Items are
# chosen in `order`, each by its steps; a choice that differs from its start value still follows the rule.
order: [pitch_pair, single_pitch, rig_ref, vo, d_vo, fusion_sigma, align, predict]
fixed:
  judged_point: rungs L4_drift, LVI and L5VI of the pose ladder as committed
  knobs: dedup radius and band, score thresholds and min_obs_cached of the frozen learned-detector configs
items:
  pitch_pair:
    start: {apple: [10, 50], pear: [20, 70]}
    candidates: every pair of the three rendered pitches
    steps:
      - {metric: coverage, of: "G6 count1 truth of the candidate / of all three pitches", run: "eval truth --subsets on the shaken val scene", pick: max}
      - {within: 0.01, metric: total_error, of: "(misses + duplicates + fp_off + fp_bg + boundary) / G6 count1 truth of the candidate", run: "rung L3 on val with passes.pitches = candidate", pick: min}
      - {within: 0.005, metric: tree_mae_over_mean, run: "the same L3 runs", pick: min}
      - {tie: start}
  single_pitch:
    start: {apple: 30, pear: 45}
    candidates: each rendered pitch
    steps: as pitch_pair
  rig_ref:
    start: {apple: {"10,50": 50, "10,30": 10}, pear: {"20,70": 70}}
    candidates: the pitches of the chosen pair; the single pitch for one camera
    steps:
      - {metric: end_position_drift_median, of: "per-camera odometry alone, depth noise k 0.0036, both sides", pick: min}
  vo:
    start: {depth_nb: 2, n_features: 6000, final_px: 2.0, depth_max_m: 10.0}   # VoConfig keys; the other keys keep their configs/pose/vo.yaml values
    candidates: {depth_nb: [1, 2], depth_max_m: [10.0, 3.0]}   # the four combinations; n_features and final_px keep their start values
    steps:
      - {metric: interpass_p90, of: "same side and both sides, after fusion and alignment", rung: LVI, pick: min}
      - {metric: end_drift_median, rung: LVI, pick: min}
      - {metric: rpe_p90, rung: LVI, pick: min}
  d_vo:
    start: {drift_step_trans_mm: 0.7, drift_step_rot_deg: 0.013, drift_scale_sigma: 0.003, drift_rate_deg_per_m: 0.03}
    fit_to: [rpe_p50, end_drift_median, end_rotation_median]   # measured in the reference camera frame
    rung: LV
  fusion_sigma:
    start: {vo_sigma_trans_mm: 2.1, vo_sigma_rot_deg: 0.039}
    candidates: ["val odometry rpe_p50 / 1.54", "the judged walk sigmas", "3 x the judged walk sigmas"]
    steps: as vo
    scope: file pose source only; a truth source takes its factor sigmas from its drift values
  align:
    start: {segment_m: 3.0, pair_radius_m: 0.5, roll_pitch_sigma_deg: "2 sqrt((b0/g)^2 + d^2), d = imu_extr_rot_deg"}
    fixed: {min_pairs: 20}     # not a candidate
    candidates: {segment_m: [3.0, 6.0], roll_pitch_sigma_deg: [0.25, 1.0, "2 sqrt((b0/g)^2 + d^2)"]}
    steps:
      - {veto: "drop a candidate whose L3_al differs from L3, in either direction, by more than the limit of its crop in any of the three metrics",
         rung: L3_al, of: "the signed row e_pipe (y6.row.e_pipe), y6.metrics.miss_rate and y6.metrics.excess_rate",
         limits: {apple: {row_e_pipe: 0.01, miss_rate: 0.015, excess_rate: 0.015},
                  pear: {row_e_pipe: 0.005, miss_rate: 0.005, excess_rate: 0.005}}}
      - {metric: interpass_p90, rungs: [L4_drift, LVI], pick: min}
      - {tie: simplest}
  predict:
    start: pose
    candidates: [pose, pose_local]
    window: the number m of recent observations of pose_local, chosen by the same steps when pose_local is a candidate
    window_candidates: [1, 3, 5]
    point: the judged point with the rpe_weak jitter
    steps:
      - {metric: y1_duplicates_plus_misses_median, pick: min}
      - {within: 0.005, tie: simplest, order: [pose, pose_local]}
vetoes:
  count: drop a pose-knob candidate whose LVI (misses + excess) is more than 0.01 above the best candidate's
  other_path: on the straight val scene of seed 200 with the assumed constant-speed IMU, take the next candidate when the chosen one is worse on the same pose metric; not for pitch_pair or single_pitch
  exp_scene: the exp scene has one pitch; it is not used for the alignment knobs
  predict: drop a prediction whose Y1 duplicates plus misses at the judged point (rung L4_drift) or the truth point (rung L3) are more than 0.01 above the best candidate's
detail:   # how the steps read, compare and combine their metrics
  metrics: every metric is the mean over noise seeds 0, 1 and 2 (one run for a rung without noise) on the one shaken val scene of the crop, read from runs[0].rungs[<rung>] of results.json; total_error = (miss_det + miss_drop + miss_merge + dup_track + dup_cross + fp_off + fp_bg + boundary) / n_truth of y6.ledger; the count of the count veto = y6.metrics.miss_rate + y6.metrics.excess_rate of rung LVI (the misses plus the excess of the ledger equation, boundary left out); the three values of the L3_al veto = the signed y6.row.e_pipe, y6.metrics.miss_rate and y6.metrics.excess_rate; coverage = G6 of the candidate / G6 of all, from the G6 integers of the count1 table of eval truth --subsets on the shaken val scene (subset drop <the third pitch> for a pair, only <pitch> for one pitch); tree_mae_over_mean = y6.metrics.tree_mae_over_mean; interpass_p90 = max(pose_quality.interpass.same_side.p90_m, pose_quality.interpass.both_sides.p90_m), both sides alone when there is no same-side pair; end_drift_median = pose_quality.summary.in_pass.pos_m; end_rotation_median = pose_quality.summary.in_pass.rot_deg; rpe_p50 and rpe_p90 = pose_quality.rpe.trans_m.p50 and p90, and the rotation p50 = pose_quality.rpe.rot_deg.p50; the odometry-alone RPE = pose_quality.rpe.trans_m.p50 and rot_deg.p50 of an eval run with pose.source=file, pose.cache=vo, pose.anchor=first_truth, the rig off and fusion off (each pass in its own camera frame); y1_duplicates_plus_misses_median = the median over the passes of (dup_track + dup_cross + miss_det + miss_drop + miss_merge) / n_truth of y1.passes[*].ledger (per_seed[*] for a rung with noise), averaged over the seeds; the row e_pipe = y6.row.e_pipe
  ties: a within on a step is the band of the step before it, so the candidates within that value of the best on the earlier step's metric are equal there and go on to the step that carries the within (pitch_pair, single_pitch and predict); a step followed by a step without within rounds metres to 1e-4 m (0.1 mm), degrees to 0.001 and ratios to 0.0001 and counts equal rounded values as equal; equal candidates go to the next step, and candidates still equal after the last step take the start value (for align the simplest candidate is the start value)
  align: in the order of its steps; (1) for each segment_m candidate rungs L3 and L3_al run (roll_pitch_sigma_deg acts only on fused rungs, not on L3_al), and a segment_m is dropped when the difference L3_al - L3 of any of the three signed values exceeds the crop's limit in size, in either direction; (2) every remaining segment_m with each roll_pitch_sigma_deg candidate (0.25, 1.0, the formula) runs on rungs L4_drift and LVI, and the count veto drops the combinations whose count is more than 0.01 above the best combination's; (3) the metric is the mean of the interpass_p90 of the two rungs, and a tie takes the simplest, the start value (3.0 m and the formula); (4) the other_path veto; pair_radius_m 0.5 and min_pairs 20 stay fixed
  d_vo: one value for both crops; the target is the crop mean of four values of rung LV on val with the chosen pair, reference camera and odometry and the start fusion sigmas, in the reference camera frame (RPE translation p50, RPE rotation p50, end drift median, end rotation median); the model is the crop mean of the same four on rung L4_drift_noimu with the alignment off and the drift values under fit; each round multiplies drift_step_trans_mm by the target / model ratio of the RPE translation, drift_step_rot_deg by that of the RPE rotation, drift_rate_deg_per_m by that of the end rotation and drift_scale_sigma by that of the end drift, rounded to two significant digits; it starts from the start values and runs at most three rounds, stops when all four are within 15% of the target, and otherwise keeps the round with the smallest largest relative error of the four; the per-camera odometry values (an odometry-alone eval run per pitch of the pair with passes.pitches = [p], the same four) are reported beside it and not fitted
  fusion_sigma: one value for both crops; the three candidates are (a) the crop mean of the odometry-alone RPE translation p50 / 1.54 and RPE rotation p50 / 1.54 in mm and deg, rounded to two significant digits, the odometry-alone RPE being that of each camera's odometry in its own camera frame with the chosen pair and odometry, not the reference-frame RPE of rung LV, since the odometry factor joins neighbouring frames of one camera and its sigma matches one camera's step noise, while LV joins the two cameras into one body path with a lower step noise and its reference frame adds the rig calibration error to the other camera's passes (the LV values are reported beside it); (b) the judged walk 2.1 mm and 0.039 deg, the start; (c) three times the judged walk, 6.3 mm and 0.117 deg; a step value is the mean over the two crops of the crop's metric divided by that of candidate (b); the count veto is applied per crop and drops a candidate caught in either crop
  vetoes: the count veto applies to vo, fusion_sigma and align, the pose knobs (not to rig_ref, which is not a knob, to predict, a tracker knob, or to d_vo, a fit without candidates), and drops candidates before the item's steps, the best candidate being the one with the smallest count; the other_path veto applies to vo, fusion_sigma, align and rig_ref, the items whose first metric is a pose metric (not to predict, whose metric is Y1, or to d_vo), and runs once after the steps choose, on the straight val scene of seed 200 with the I_ext IMU file of the assumed constant-speed trajectory, comparing the item's first-step metric of the chosen candidate and of the second candidate in step order and taking the second when the chosen one is worse by more than the ties threshold; it runs one step only (the second is not compared again with the third), and fusion_sigma compares by the two-crop mean ratio
  predict: at the judged point with the rpe_weak jitter the four candidates pose and pose_local with window 1, 3 and 5 are chosen in one pass of the steps; the predict veto on rungs L4_drift and L3 comes first, then among the candidates within 0.005 of the smallest y1_duplicates_plus_misses_median the simplest wins, in the order pose, pose_local 1, 3, 5; the window is not chosen first and compared with pose afterwards, since two passes of 0.005 could keep a pose more than 0.005 worse than the best candidate
tuning: true
