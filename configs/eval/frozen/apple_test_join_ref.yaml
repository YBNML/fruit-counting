# Held-out paired run for the report (configuration label c2_ref): the frozen pose config apple_test_pose.yaml as it
# is, on the same scenes and seeds as apple_test_join.yaml, so the two runs differ by the cross-side join rule alone.
# The criteria read its rows as report rows (they judge configuration c2). The protect section is that of
# apple_test_join.yaml without the grid.
run_name: apple_test_join_ref
crop: apple
split: test                # held-out run; every setting below was fixed before this run and is never tuned here
tuning: false
runs: [~/datasets/orchard_synth/apple/test_s1006_shake, ~/datasets/orchard_synth/apple/test_s1007_shake,
       ~/datasets/orchard_synth/apple/test_s1008_shake]
truth: {variant: count1}
passes: {pitches: [10, 50], sides: [A, B], step_m: null}
stages: {det: oracle, track: landmark, center: measured, dedup: hybrid, assign: grid}
detector:
  positives: count1
  cache: runs/detect/88e8c93628216703
  noise: null
lift: {depth: box_far, box_frac: 0.5, center_offset_m: {fruit: 0.02, bag: 0.03}}
noise: {pose_trans_sigma_m: 0, pose_rot_sigma_deg: 0, pass_bias_m: 0, depth_rel_sigma: 0, depth_dropout: 0, seeds: [0, 1, 2]}
tracker: {predict: pose, gate_px_frac: 0.5, gate_m: 0.05, max_gap: null, repair_m: 0.08, min_obs: 1, score_hi: 0.6, score_lo: 0.2, min_obs_cached: 4, depth_gate: soft}
dedup: {radius_m: 0.09, band_m: 0.05}
pose:
  rig_ref: 10
  config_label: c2_ref
  caches:                   # configs/pose/frozen/apple_vo.yaml and apple_vo_dd.yaml; one pinned pose cache digest per bundle
    vo:
      dir: runs/pose/b16b37e34b609dd2
    vo_dd:
      dir: runs/pose/52ad7d4423dea8fb
  imu_files:                # configs/pose/frozen/imu_ext.yaml, the judged IMU profile only; one pinned IMU file digest per bundle
    imu_ext:
      dir: runs/imu/682fc7ac53717171
align: {mode: none, segment_m: 3.0, pair_radius_m: 0.5, roll_pitch_sigma_deg: 1.0, min_pairs: 20, oracle_sigma_m: 0.02}   # knobs chosen on val
seed: 0
stop_after: y6
output_dir: runs/eval_join
protect:
  ladder: {path: configs/eval/sweeps_pose/ladder_pose.yaml, sha256: "ac67a004fd26b90683c1f0a3db1347450c06c83d8c3c5faf2b7c383c3b4e1c3e"}
  splits: {path: configs/eval/splits_depth.yaml, sha256: "139b6645ffa503e4430fbe18300e3328b73f4beb03cdbbf82c1e5fe734f88401"}
  criteria: {path: configs/eval/criteria_pose.yaml, sha256: "24902bff836f789eca403d398d98482220b524e2c318c67d0279ef8639024d3a"}
  output_dir: runs/eval_join
  judged: [L4_drift, LVI, L5VI]   # the first one sets the values of the val-only axes
  ladders:
    - [L3, L4_drift, LVI, L5, L5VI, L3_al, L4_drift_noimu, L4_drift_noal, L4_drift_fitp, L4_drift_c1x, L4_drift_dvo,
       L3_pass, L3_pass_al, L3_pass_c1x, LV, L5V, LVI_first, LVI_fitp, LVI_fits, LVI_dd, LVI_rowbias5, LVI_rowbias10,
       LVI_thin50, LVI_thin80, LVI_oracle_struct, L4_base, L5_L4base, B_drift, B_drift_fitp, B_pass, B_pass_c1x]
