# Faster R-CNN R50-FPN v2 from COCO weights, trained on the synthetic train bundles (seeds: train in configs/eval/splits.yaml).
run_name: frcnn_synth
pretrained: true
seed: 0
num_workers: 4
log_every: 20
device: cuda
output_dir: runs/train
model:
  arch: fasterrcnn_resnet50_fpn_v2
  anchor_sizes: [16, 32, 64, 128, 256]
  aspect_ratios: [0.5, 1.0, 2.0]
  train_size: 1024
  infer_min_size: 1080
  infer_max_size: 1920
  max_dets: 1000
  score_min: 0.05
  rpn_pre_nms_train: 2000
  rpn_post_nms_train: 2000
  rpn_pre_nms_test: 2000
  rpn_post_nms_test: 2000
  box_batch_per_image: 512
  trainable_backbone_layers: 3
  freeze_backbone_bn: true
data:
  crops: [apple, pear]
  root: "~/datasets/orchard_synth/{crop}/train_s{seed}"
  seeds: null
aug:
  hflip_p: 0.5
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.02
optim:
  epochs: 12
  batch_size: 2
  lr: null
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 500
  min_lr: 0.0
  clip_grad_norm: 10.0
