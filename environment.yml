name: counting-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pillow
  - pandas
  - pyyaml
  - tqdm
  - scipy
  - scikit-learn
  - opencv=5.0.*
  - pytorch=2.14.*
  - torchvision=0.29.*
  - tensorboard
  - pytest
  - pytest-cov
  - pip:
      - typer>=0.12
      - pydantic>=2.12
      - albumentations<=2.0.8
      - timm
      - rich
      - open_clip_torch
